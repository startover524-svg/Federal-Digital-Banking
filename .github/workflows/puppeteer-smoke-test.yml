name: Puppeteer smoke test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Start static server
        run: npx http-server ./dist -p 4173 --silent &

      - name: Wait for server
        run: |
          for i in {1..15}; do
            if curl -sSf http://localhost:4173/ >/dev/null; then
              echo "server up"; break;
            fi
            sleep 1
          done

      - name: Run Puppeteer smoke screenshot
        env:
          TARGET_URL: http://localhost:4173/
        run: node tests/smoke-screenshot.js

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: test-output/signed-in.png

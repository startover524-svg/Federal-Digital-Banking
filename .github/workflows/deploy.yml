name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages (using PAT)
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Use a personal access token stored in the repository secret `DEPLOY_PAT`.
          # Create a PAT with `repo` scope and add it under Settings → Secrets → Actions.
          personal_token: ${{ secrets.DEPLOY_PAT }}
          publish_dir: ./dist
          publish_branch: gh-pages

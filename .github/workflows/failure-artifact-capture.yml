name: Capture failure artifacts

on:
  workflow_run:
    workflows: ["Puppeteer smoke test"]
    types: [completed]

jobs:
  capture:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts from failed run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: downloaded-artifacts

      - name: List downloaded files
        run: ls -la downloaded-artifacts || true

      - name: Create issue with failure screenshot
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = './downloaded-artifacts';
            const files = [];
            if (fs.existsSync(path)) {
              const walk = (dir) => fs.readdirSync(dir).forEach(f => {
                const p = `${dir}/${f}`;
                if (fs.statSync(p).isDirectory()) walk(p);
                else files.push(p);
              });
              walk(path);
            }

            let body = `Automated failure capture for [run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID || github.event.workflow_run.id}).\n\n`;
            if (files.length === 0) {
              body += 'No artifacts were found attached to the failed run.';
            } else {
              for (const f of files) {
                try {
                  const buf = fs.readFileSync(f);
                  const b64 = buf.toString('base64');
                  body += `\n### Artifact: ${f.replace(path + '/', '')}\n\n`;
                  body += `<img alt=\"artifact\" src=\"data:image/png;base64,${b64}\" />\n`;
                } catch (err) {
                  body += `\nCould not embed ${f}: ${err.message}\n`;
                }
              }
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI: failure artifacts for run ${github.event.workflow_run.id}`,
              body
            });

      - name: Notify Slack (optional)
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          payload="{\"text\":\"CI failure: artifacts for run ${RUN_ID} in repository ${GITHUB_REPOSITORY}. See ${RUN_URL}\"}"
          curl -sSf -X POST -H 'Content-type: application/json' --data "$payload" "${{ secrets.SLACK_WEBHOOK_URL }}" || echo "Slack notify failed"

      - name: Send email notification (optional)
        if: ${{ secrets.SMTP_SERVER && secrets.SMTP_USERNAME && secrets.SMTP_PASSWORD && secrets.EMAIL_RECIPIENT }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI failure artifacts for run ${{ github.event.workflow_run.id }} in ${{ github.repository }}"
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            The workflow "Puppeteer smoke test" failed for run ${{ github.event.workflow_run.id }} in repository ${{ github.repository }}.
            Artifacts were downloaded and an issue was created with inline screenshots. Visit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}